server:
  # Railway 등 배포 환경은 PORT 환경변수로 리슨할 포트를 지정해준다. 로컬은 그대로 8080.
  port: ${PORT:8080}
  # Railway는 앞단에서 HTTPS를 종료하고 컨테이너에는 HTTP로 전달한다. 프록시가 X-Forwarded-* 헤더를
  # 제대로 보내는 경우를 위해 켜두지만, 카카오 리다이렉트 URI 자체는 아래 app.backend-url로 직접 못박아서
  # 이 설정에 의존하지 않게 했다(플랫폼마다 프록시 헤더 처리가 달라 신뢰하기 어려움).
  forward-headers-strategy: framework

spring:
  config:
    import: optional:classpath:application-secret.yml

  datasource:
    # 로컬 개발은 기본값(:뒤)이 그대로 쓰이고, 배포 환경은 DB_HOST 등 환경변수로 덮어쓴다.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:petiteldb}?currentSchema=${DB_SCHEMA:petitel}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:petitel}
    password: ${DB_PASSWORD:petitel1234}

  sql:
    init:
      mode: always

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${kakao.client-id}
            client-secret: ${kakao.client-secret}
            # {baseUrl}은 프록시 헤더(X-Forwarded-Proto)에 의존하는데 플랫폼마다 동작이 달라 신뢰하기 어려워서,
            # 배포 시 BACKEND_URL 환경변수로 실제 https 주소를 직접 못박는다 (app.backend-url 정의는 아래 참고).
            redirect-uri: "${app.backend-url}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

jwt:
  secret: ${jwt.secret}
  expiration: 86400000

app:
  # 이 백엔드 자신의 공개 주소. 카카오 리다이렉트 URI를 만드는 데 쓴다. 배포 시 BACKEND_URL로 override.
  backend-url: ${BACKEND_URL:http://localhost:8080}
  # 로그인 성공 후 돌려보낼 프론트 주소. 배포 시 FRONTEND_URL로 override.
  frontend-url: ${FRONTEND_URL:http://localhost:5173}