server:
  # Railway 등 배포 환경은 PORT 환경변수로 리슨할 포트를 지정해준다. 로컬은 그대로 8080.
  port: ${PORT:8080}

spring:
  config:
    import: optional:classpath:application-secret.yml

  datasource:
    # 로컬 개발은 기본값(:뒤)이 그대로 쓰이고, 배포 환경은 DB_HOST 등 환경변수로 덮어쓴다.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:petiteldb}?currentSchema=${DB_SCHEMA:petitel}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:petitel}
    password: ${DB_PASSWORD:petitel1234}

  sql:
    init:
      mode: always

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${kakao.client-id}
            client-secret: ${kakao.client-secret}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

jwt:
  secret: ${jwt.secret}
  expiration: 86400000